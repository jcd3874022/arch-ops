<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FF Agent - Intel</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root{--bg:#0b0f14;--card:#141b24;--line:#243040;--tx:#e8eef5;--dim:#8fa1b5;--acc:#3fb68b;--warn:#e0a04a;--bad:#e06060}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:70px}
header{padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:19px}
.meta{color:var(--dim);font-size:12px;margin-top:2px}
nav{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;color:var(--dim);font-size:13px;padding:8px 0;border-radius:8px}
nav button.on{background:var(--bg);color:var(--acc);font-weight:600}
main{padding:12px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;color:var(--dim)}
.badge.acc{color:var(--acc)} .badge.warn{color:var(--warn)}
.div-h{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 6px}
.kv{color:var(--dim);font-size:12px;margin-top:3px}
.sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sec b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.sec p{margin-top:4px;font-size:13.5px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
.inj{color:var(--bad);font-size:11px}
.back{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:13px}
input,select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px;font-size:14px}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>*{flex:1}
.spin{color:var(--dim);padding:30px;text-align:center}
#flowwrap{background:#fff;border-radius:12px;padding:8px;overflow-x:auto}
#flowwrap svg{min-width:640px}
.legend{display:flex;gap:14px;margin:8px 2px;color:var(--dim);font-size:12px}
.w-face{width:74px;height:74px;border-radius:12px;object-fit:cover;object-position:top center;background:#0b0f14 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23243040%27 d=%27M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z%27/%3E%3C/svg%3E") center/60% no-repeat;border:1px solid var(--line);flex:0 0 auto}
.w-headrow{display:flex;gap:12px;align-items:flex-start}
.w-headrow>div{min-width:0;flex:1}
.w-face-sm{width:30px;height:30px;border-radius:8px;object-fit:cover;object-position:top center;background:#0b0f14;border:1px solid var(--line);flex:0 0 auto}

.w-strip{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.w-strip .lbl{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.w-strip .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.w-strip .sep{width:1px;align-self:stretch;background:var(--line)}
.w-strip>div{flex:1}
.w-live{display:flex;align-items:center;gap:5px;flex:0 0 auto!important}
.w-dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.w-dot.on{background:var(--acc);animation:wp 1.6s infinite}
@keyframes wp{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.w-dot.on{animation:none}}

.w-hero{background:linear-gradient(160deg,#172a24,#141b24 60%);border:1px solid var(--acc);border-radius:14px;padding:16px;margin-bottom:10px}
.w-hero.wait{background:var(--card);border-color:var(--line)}
.w-eyebrow{color:var(--acc);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.w-hero.wait .w-eyebrow{color:var(--dim)}
.w-name{font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.w-sub{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.w-chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.w-chip.pos{background:rgba(63,182,139,.14);border-color:var(--acc);color:var(--acc)}

.w-alt{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.w-alt .nm{flex:1;font-size:14px}
.w-alt .pc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;width:38px;text-align:right}
.w-bar{width:64px;height:5px;border-radius:99px;background:var(--line);overflow:hidden;flex:0 0 auto}
.w-fill{height:100%;background:var(--acc)}
.w-fill.mid{background:var(--warn)} .w-fill.low{background:var(--bad)}

.w-holes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.w-hole{font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(224,96,96,.12);border:1px solid var(--bad);color:var(--bad)}
.w-hole.ok{background:none;border-color:var(--line);color:var(--dim)}

.w-tick{display:flex;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);align-items:baseline}
.w-tick .no{color:var(--dim);font-variant-numeric:tabular-nums;width:30px;flex:0 0 auto}
.w-tick .nm{flex:1}
.w-tick .rs{color:var(--dim);font-size:11px}
.w-note{color:var(--dim);font-size:11px;margin-top:10px;font-style:italic}
.w-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.w-tools button{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:13px}
.w-tools button:disabled{opacity:.4}
.w-tools button.go{border-color:var(--acc);color:var(--acc);font-weight:600}

</style></head><body>
<header><h1>FF Agent &mdash; Team &amp; Player Intel</h1><div class="meta" id="meta">loading&hellip;</div></header>
<main id="main"><div class="spin">Loading&hellip;</div></main>
<nav>
<button id="nb-teams" class="on" onclick="go('teams')">Teams</button>
<button id="nb-players" onclick="go('players')">Players</button>
<button id="nb-draft" onclick="go('draft')">Draft</button>
<button id="nb-model" onclick="go('model')">Model</button>
<button id="nb-league" onclick="go('league')">League</button>
<button id="nb-flow" onclick="go('flow')">Flow</button>
<button id="nb-intel" onclick="go('intel')">Intel</button>
<button id="nb-war" onclick="go('war')">War</button>
</nav>
<script>
const API='https://ekmuzafyqlbqttmfxsgw.supabase.co/functions/v1/ff-dashboard';
mermaid.initialize({startOnLoad:false,theme:'neutral',flowchart:{useMaxWidth:false}});
const MM='flowchart TB\n subgraph SRC["DATA SOURCES"]\n  S1["Sleeper API - rosters, depth, injuries (LIVE)"]\n  S2["Coach/Team Intel - 32 profiles + funnels (LOADED)"]\n  S3["Vegas lines - win totals, implied totals (partial)"]\n  S4["Schedule grid - byes, short weeks, SOS (pending)"]\n  S5["Measured data Wk4+ - PROE, pace, snap pct"]\n  S6["League platform - your roster, scoring, FAAB (pending: league ID)"]\n end\n subgraph DB["SUPABASE"]\n  D1[("ff_teams")]\n  D2[("ff_players")]\n  D3[("ff_sync_log")]\n  D4[("ff_league / ff_roster - next")]\n end\n S1 -->|"ff-sleeper-sync, auto 24h"| D2\n S2 --> D1\n S3 -.-> D1\n S4 -.-> D4\n S6 -.-> D4\n subgraph BRAIN["AGENT DECISION ENGINE (next build)"]\n  B1["Matchup scorer: player x DC funnel x venue x implied total"]\n  B2["Glass-box weights - editable multipliers"]\n  B3["Roster optimizer - start/sit + flex ranks"]\n  B4["Waiver scanner - snap spikes, injury openings, FAAB sizing"]\n  B5["Trade evaluator - tank-team sellers, deadline windows"]\n end\n D1 --> B1\n D2 --> B1\n B2 --> B1\n B1 --> B3\n D2 --> B4\n D1 --> B5\n S5 -.->|"supersedes priors Wk8"| B2\n subgraph WEEK["WEEKLY CADENCE"]\n  W1["TUE night - waivers run"]\n  W2["WED - waiver results + trade scan"]\n  W3["THU-SAT - injury monitoring"]\n  W4["SUN AM - inactives check, final lineup"]\n  W5["SUN-MON - late-swap watch"]\n end\n B4 --> W1\n B5 --> W2\n D2 --> W3\n B3 --> W4\n W3 --> W4\n W4 --> W5\n subgraph JASON["YOUR GATES (maestro mode)"]\n  J1{"Auto-execute: injury-driven swaps"}\n  J2{"Propose, you approve: trades, big FAAB, ranked drops"}\n  J3["Dashboard (this site)"]\n end\n W4 --> J1\n W1 --> J2\n W2 --> J2\n D1 --> J3\n D2 --> J3\n B1 -.->|"scores surface here next"| J3';
const $=s=>document.querySelector(s);const M=$('#main');
let TEAMS=[],view='teams';
const esc=s=>(s??'').toString().replace(/</g,'&lt;');
function ffkey(){let k=null;try{k=localStorage.getItem('ffkey')}catch(e){}
  if(!k){k=prompt('Access key:');if(k){try{localStorage.setItem('ffkey',k)}catch(e){}}}
  return k||''}
async function api(q){
  let r=await fetch(API+'?api='+q,{headers:{'x-ff-key':(function(){try{return localStorage.getItem('ffkey')||''}catch(e){return ''}})()}});
  if(r.status===401){try{localStorage.removeItem('ffkey')}catch(e){}
    r=await fetch(API+'?api='+q,{headers:{'x-ff-key':ffkey()}});
    if(r.status===401){return {error:'locked'}}}
  return r.json()}
async function boot(){
  const p=new URLSearchParams(location.search);if(p.get('view'))view=p.get('view');
  try{
    const m=await api('meta');
    $('#meta').textContent=(m.playerCount||0)+' players \u00b7 '+(m.contractWatch||0)+' contract flags'+(m.last?' \u00b7 last sync '+m.last.slice(0,16).replace('T',' ')+'Z':'')+(m.syncTriggered?' \u00b7 refresh triggered':'');
    TEAMS=await api('teams');
  }catch(e){$('#meta').textContent='API unreachable \u2014 check Supabase functions';}
  go(view)}
function go(v){view=v;['teams','players','draft','model','league','flow','intel','war'].forEach(x=>{const b=$('#nb-'+x);if(b)b.classList.toggle('on',x===v)});render()}
function render(){if(view==='teams')teams();else if(view==='players')players();else if(view==='draft')draftView();else if(view==='model')modelView();else if(view==='league')leagueView();else if(view==='flow')flow();else if(view==='war')warView();else intel()}

let WARMODE=(function(){try{return localStorage.getItem('warmode')||'REHEARSAL'}catch(e){return 'REHEARSAL'}})();
let WARTIMER=null,WARLAST=null;
function warSetMode(m){WARMODE=m;try{localStorage.setItem('warmode',m)}catch(e){};warStop();warView()}
function warStop(){if(WARTIMER){clearInterval(WARTIMER);WARTIMER=null}}
async function warPoll(){
  const d=await api('war&op=poll&draft='+encodeURIComponent(WARMODE==='LIVE'?'':'REHEARSAL')).catch(()=>null);
  if(d&&!d.error){WARLAST=d;warDraw()}
}
function warStart(){warStop();warPoll();WARTIMER=setInterval(warPoll,4000);warDraw()}
async function warFake(){
  const n=$('#wfp')?.value?.trim();if(!n)return;
  const r=await api('war&op=fake&draft=REHEARSAL&player='+encodeURIComponent(n));
  if(r&&r.error){$('#wmsg').textContent=r.error}else{$('#wfp').value='';warPoll()}
}
async function warReset(){warStop();const r=await api('war&op=reset&draft=REHEARSAL');$('#wmsg').textContent=r&&r.reset?('Reset. Keepers seeded: '+r.keepers_seeded):'reset failed';warPoll()}
function wImg(id,cls){if(!id)return '<span class="'+cls+'"></span>';
  const u=/^[A-Z]{2,3}$/.test(id)?('https://sleepercdn.com/images/team_logos/nfl/'+id.toLowerCase()+'.png'):('https://sleepercdn.com/content/nfl/players/thumb/'+id+'.jpg');
  return '<img class="'+cls+'" src="'+u+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'}
function warDraw(){
  const d=WARLAST,live=WARMODE==='LIVE';
  const mine=d&&d.my_next_pick!=null&&d.on_clock&&d.on_clock.pick===d.my_next_pick;
  const away=d&&d.my_next_pick!=null?d.my_next_pick-d.on_clock.pick:null;
  let h='';
  h+='<div class="w-strip">'
    +'<div><div class="lbl">On the clock</div><div class="val">'+(d?('#'+d.on_clock.pick):'\u2014')+'</div></div>'
    +'<div class="sep"></div>'
    +'<div><div class="lbl">Your pick</div><div class="val">'+(d&&d.my_next_pick!=null?('#'+d.my_next_pick):'\u2014')+'</div></div>'
    +'<div class="sep"></div>'
    +'<div><div class="lbl">'+(mine?'Status':'Picks away')+'</div><div class="val" style="'+(mine?'color:var(--acc)':'')+'">'+(mine?'NOW':(away!=null?away:'\u2014'))+'</div></div>'
    +'<div class="w-live"><span class="w-dot'+(WARTIMER?' on':'')+'"></span><span class="lbl">'+(WARTIMER?'live':'idle')+'</span></div>'
  +'</div>';
  const a=d&&d.advice;
  if(a&&a.primary){
    const p=a.primary;
    h+='<div class="w-hero'+(mine?'':' wait')+'">'
      +'<div class="w-eyebrow">'+(mine?'Take him now':'If it were your pick')+'</div>'
      +'<div class="w-headrow" style="margin-top:6px">'+wImg(p.sleeper_id,'w-face')+'<div><div class="w-name">'+p.player+'</div>'
      +'<div class="w-sub"><span class="w-chip pos">'+p.position+'</span>'
      +'<span class="w-chip">ADP '+p.adp+'</span>'
      +'<span class="w-chip">'+(p.surv_next>0?(p.surv_next+'% to last till #'+(a.next_pick||'?')):'gone by your next')+'</span></div></div></div>';
    const ho=a.holes&&a.holes.by_position;
    if(ho){h+='<div class="w-holes">'+Object.entries(ho).map(([k,v])=>'<span class="w-hole'+(v.short>0?'':' ok')+'">'+k+' '+v.have+'/'+v.need+'</span>').join('')+'</div>'}
    h+='<div class="w-note">Advice only \u2014 you tap the pick in Sleeper.</div></div>';
    if(a.contingencies&&a.contingencies.length){
      h+='<div class="card"><h3>If he\u2019s gone</h3>';
      h+=a.contingencies.map(c=>{const s=Math.max(0,Math.min(100,c.surv_next||0));const cls=s>60?'':(s>30?' mid':' low');
        return '<div class="w-alt">'+wImg(c.sleeper_id,'w-face-sm')+'<span class="nm">'+c.player+' <span style="color:var(--dim);font-size:11px">'+c.position+'</span></span>'
          +'<span class="w-bar"><span class="w-fill'+cls+'" style="width:'+s+'%"></span></span><span class="pc">'+s+'%</span></div>'}).join('');
      h+='<div class="w-note">Bar = odds he survives to your next pick.</div></div>';
    }
  } else if(d){ h+='<div class="card"><div class="spin">No picks left to advise.</div></div>' }
  else { h+='<div class="card"><div class="spin">Press Start to watch the board.</div></div>' }
  if(d&&d.recent&&d.recent.length){
    h+='<div class="card"><h3>Board<span class="badge">'+d.last_pick_no+' gone</span></h3>';
    h+=d.recent.filter(p=>p.pick_no>0).map(p=>'<div class="w-tick"><span class="no">'+p.pick_no+'</span><span class="nm">'+p.player_name+'</span><span class="rs">'+(p.position||'?')+' \u00b7 r'+p.roster_id+'</span></div>').join('')||'<div class="kv">No picks yet.</div>';
    h+='</div>';
  }
  h+='<div class="card"><h3>'+(live?'Live draft':'Rehearsal')+'<span class="badge '+(live?'warn':'')+'">'+(live?'real picks':'practice')+'</span></h3>'
    +'<div class="w-tools">'
    +'<button class="go" onclick="'+(WARTIMER?'warStop()':'warStart()')+'">'+(WARTIMER?'Stop watching':'Start watching')+'</button>'
    +'<button onclick="warSetMode(\''+(live?'REHEARSAL':'LIVE')+'\')">'+(live?'Switch to rehearsal':'Switch to live')+'</button>'
    +(live?'':'<button onclick="warReset()">Clear board</button>')+'</div>';
  if(!live)h+='<div class="row" style="margin-top:8px"><input id="wfp" placeholder="Draft someone (player name)"><button onclick="warFake()" style="flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 12px">Add</button></div>';
  h+='<div id="wmsg" class="kv"></div></div>';
  M.innerHTML=h;
}
async function warView(){warDraw();if(!WARLAST)warPoll()}

async function flow(){
  M.innerHTML='<div class="legend"><span>\u2500\u2500 built &amp; running</span><span>\u254c\u254c pending</span></div><div id="flowwrap"><div class="spin">Rendering\u2026</div></div><div class="card" style="margin-top:10px"><h3>Reading the flow</h3><p class="kv">Sources feed Supabase; the decision engine (next build) crosses your players against opponent DC funnels, venue, and implied totals with editable glass-box weights; outputs run on the weekly cadence and hit your approval gates \u2014 auto for injury swaps, propose-and-approve for trades and big FAAB. Missing unlock: your league ID.</p></div>';
  try{const {svg}=await mermaid.render('ffflow',MM);$('#flowwrap').innerHTML=svg}catch(e){$('#flowwrap').innerHTML='<pre style="color:#333;font-size:11px;white-space:pre-wrap">'+esc(MM)+'</pre>'}
}
function tier(t){return t.vegas_win_total?'Vegas '+t.vegas_win_total:'Vegas: pending'}
function teams(){
  if(!TEAMS.length){M.innerHTML='<div class="spin">No team data \u2014 API unreachable.</div>';return}
  let h='';let lastDiv='';
  for(const t of TEAMS){const d=t.conference+' '+t.division;
    if(d!==lastDiv){h+='<div class="div-h">'+d+'</div>';lastDiv=d}
    h+='<div class="card" onclick="team(\''+t.abbr+'\')"><h3>'+esc(t.name)+'<span class="badge '+(t.variance_flag?'warn':'acc')+'">'+(t.variance_flag?'HIGH VARIANCE':tier(t))+'</span></h3>'+
    '<div class="kv">HC '+esc(t.hc)+' \u00b7 OC '+esc(t.oc)+' \u00b7 DC '+esc(t.dc)+'</div>'+
    '<div class="kv">Pace '+esc(t.pace)+' \u00b7 Pass '+esc(t.pass_lean)+' \u00b7 4th '+esc(t.fourth_down)+(t.sos_flag?' \u00b7 SOS: '+t.sos_flag:'')+'</div></div>'}
  M.innerHTML=h}
async function team(ab){
  const t=TEAMS.find(x=>x.abbr===ab);
  M.innerHTML='<button class="back" onclick="go(\'teams\')">\u2190 All teams</button><div class="card"><h3>'+esc(t.name)+'<span class="badge">'+tier(t)+'</span></h3>'+
  '<div class="kv">HC '+esc(t.hc)+' \u00b7 OC '+esc(t.oc)+' \u00b7 DC '+esc(t.dc)+'</div><div class="kv">Play-caller: '+esc(t.play_caller)+'</div>'+
  '<div class="kv">Pace '+esc(t.pace)+' \u00b7 Pass lean '+esc(t.pass_lean)+' \u00b7 4th-down '+esc(t.fourth_down)+(t.bye_week?' \u00b7 Bye: Wk '+t.bye_week:'')+'</div>'+
  sec('Identity',t.identity)+sec('OC profile',t.oc_profile)+sec('DC profile',t.dc_profile)+sec('Fantasy angle',t.fantasy_angle)+sec('Vs opponent types',t.vs_opponents)+
  '</div><div id="cwrap"></div><div id="swrap"></div><div class="card"><h3>Depth chart <span class="badge">live \u00b7 Sleeper</span></h3><div id="roster" class="spin">Loading\u2026</div></div>';
  api('contracts&team='+ab).then(cs=>{if(Array.isArray(cs)&&cs.length){let h='<div class="card"><h3>Contract watch <span class="badge warn">'+cs.length+' flag'+(cs.length>1?'s':'')+'</span></h3>';for(const c of cs){h+='<div class="sec"><b>'+esc(c.player)+' \u00b7 '+esc(c.position)+' \u00b7 Tier '+esc(c.signal_tier)+'</b><p>'+esc((c.status||'').replace(/_/g,' '))+' \u2014 '+esc(c.contract_context||'')+(c.incentive_status==='PARTIAL_PUBLIC'?' Incentives: '+esc(c.incentive_detail||''):'')+(c.tag_context?' '+esc(c.tag_context):'')+'</p></div>'}h+='<div class="kv" style="margin-top:8px">Guardrail: contract status never boosts projections \u2014 alerts only. UNKNOWN incentives \u2260 none.</div></div>';document.querySelector('#cwrap').innerHTML=h}});

function sec(k,v){return v?'<div class="sec"><b>'+k+'</b><p>'+esc(v)+'</p></div>':''}
async function players(){
  let topts='<option value="">All teams</option>';for(const t of TEAMS)topts+='<option>'+t.abbr+'</option>';
  M.innerHTML='<div class="row"><input id="pq" placeholder="Search name\u2026" oninput="pfilter()"><select id="pp" onchange="pfilter()"><option value="">All pos</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option></select></div>'+
  '<div class="row"><select id="pt" onchange="pfilter()">'+topts+'</select><select id="ps" onchange="pfilter()"><option value="">All status</option><option value="healthy">Healthy only</option><option value="flagged">Injury-flagged</option></select></div>'+
  '<div id="plist" class="spin">Loading\u2026</div>';

let PSORT={k:'search_rank',d:1};
function psort(k){if(PSORT.k===k)PSORT.d*=-1;else PSORT={k:k,d:1};pfilter()}
function pfilter(){
  const q=($('#pq')?.value||'').toLowerCase(),pos=$('#pp')?.value||'',tm=$('#pt')?.value||'',st=$('#ps')?.value||'';
  let rows=(window.PL||[]).filter(p=>(!q||p.full_name.toLowerCase().includes(q))&&(!pos||p.position===pos)&&(!tm||p.team===tm)&&(!st||(st==='healthy'?!p.injury_status:!!p.injury_status)));
  const k=PSORT.k,d=PSORT.d;
  rows.sort((a,b)=>{let x=a[k],y=b[k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==='string')return d*x.localeCompare(y);return d*(x-y)});
  rows=rows.slice(0,200);
  if(!rows.length){$('#plist').innerHTML='<div class="kv">No players match these filters.</div>';return}
  const arw=key=>PSORT.k===key?(PSORT.d===1?' \u2191':' \u2193'):'';
  let h='<table><tr><th onclick="psort(\'search_rank\')">Rank'+arw('search_rank')+'</th><th onclick="psort(\'full_name\')">Player'+arw('full_name')+'</th><th onclick="psort(\'team\')">Team'+arw('team')+'</th><th onclick="psort(\'position\')">Pos'+arw('position')+'</th><th onclick="psort(\'depth_chart_order\')">Depth'+arw('depth_chart_order')+'</th><th>Status</th></tr>';
  for(const p of rows)h+='<tr onclick="team(\''+p.team+'\')"><td>'+(p.search_rank??'\u2013')+'</td><td>'+esc(p.full_name)+'</td><td>'+esc(p.team)+'</td><td>'+p.position+'</td><td>'+(p.depth_chart_order??'\u2013')+'</td><td>'+(p.injury_status?'<span class="inj">'+esc(p.injury_status)+'</span>':'')+'</td></tr>';
  $('#plist').innerHTML=h+'</table><div class="kv" style="margin-top:8px">'+rows.length+' shown \u00b7 tap headers to sort \u00b7 Rank = Sleeper search_rank (popularity proxy, not a projection) \u00b7 tap a row for team intel.</div>'}
let BOARD=null,GONE={};
try{GONE=JSON.parse(localStorage.getItem('ffgone')||'{}')}catch(e){}

async function draftView(){
  M.innerHTML='<div class="spin">Loading board\u2026</div>';

function strike(id){GONE[id]=!GONE[id];if(!GONE[id])delete GONE[id];saveGone();drawBoard()}
function drawBoard(){
  const d=BOARD;if(d&&d.error==='locked'){M.innerHTML='<div class="kv">Locked. Wrong or missing access key \u2014 reload to retry.</div>';return}

  let top='<div class="card"><h3>Your next pick: #'+nextPick+' <span class="badge acc">'+gone+' players marked gone</span></h3>'+
  '<div class="kv">Your picks: '+picks.join(', ')+' (R6/R7 paid for Bucky + JSN)</div>'+
  '<div class="kv">Best available: '+live.slice(0,3).map(r=>r.full_name+' ('+r.position+', '+r.score+')').join(' \u00b7 ')+'</div></div>';
  top+='<div class="row"><input id="dq" placeholder="Search\u2026" value="'+(q||'')+'" oninput="drawBoard()"><select id="dp" onchange="drawBoard()"><option value=""'+(pos===''?' selected':'')+'>All pos</option>'+['QB','RB','WR','TE','K'].map(p=>'<option'+(pos===p?' selected':'')+'>'+p+'</option>').join('')+'</select></div>'+
  '<div class="row"><label class="kv"><input type="checkbox" id="dh" '+(hideG?'':'checked')+' onchange="drawBoard()"> show marked-gone</label><button class="back" style="margin:0" onclick="weightsPanel()">\u2699 weights</button></div>';
  let rows=d.rows.filter(r=>(!pos||r.position===pos)&&(!q||r.full_name.toLowerCase().includes(q)));

  let h='<table><tr><th>#</th><th>Player</th><th>Pos</th><th>Bye</th><th>Score</th><th></th></tr>';let i=0;
  for(const r of rows.slice(0,150)){i++;

    const struck=GONE[r.sleeper_id]?' style="opacity:.35;text-decoration:line-through"':'';

  h+='</table><div class="kv" style="margin-top:8px">Tap a row to mark drafted (persists on this phone). Score = (300 \u2212 Sleeper rank) + playoff-window pts + bye fit \u2014 tap-hold a score for the full math. Sleeper rank is a market proxy; projection feed pending. KEEP rows are projected/declared keepers \u2014 excluded from best-available.</div>';
  M.innerHTML=top+h;if(q){const el=$('#dq');el.focus();el.setSelectionRange(q.length,q.length)}}
async function weightsPanel(){
  const d=BOARD;let h='<button class="back" onclick="drawBoard()">\u2190 Board</button><div class="card"><h3>Glass-box weights</h3>';

async function saveWeights(){

async function modelView(){
