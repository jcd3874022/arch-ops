<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FF Agent - Intel</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root{--bg:#0b0f14;--card:#141b24;--line:#243040;--tx:#e8eef5;--dim:#8fa1b5;--acc:#3fb68b;--warn:#e0a04a;--bad:#e06060}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:70px}
header{padding:16px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:19px}
.meta{color:var(--dim);font-size:12px;margin-top:2px}
nav{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;color:var(--dim);font-size:13px;padding:8px 0;border-radius:8px}
nav button.on{background:var(--bg);color:var(--acc);font-weight:600}
main{padding:12px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;color:var(--dim)}
.badge.acc{color:var(--acc)} .badge.warn{color:var(--warn)}
.div-h{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 6px}
.kv{color:var(--dim);font-size:12px;margin-top:3px}
.sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sec b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.sec p{margin-top:4px;font-size:13.5px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
.inj{color:var(--bad);font-size:11px}
.back{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:13px}
input,select{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px;font-size:14px}
.row{display:flex;gap:8px;margin-bottom:10px}
.row>*{flex:1}
.spin{color:var(--dim);padding:30px;text-align:center}
#flowwrap{background:#fff;border-radius:12px;padding:8px;overflow-x:auto}
#flowwrap svg{min-width:640px}
.legend{display:flex;gap:14px;margin:8px 2px;color:var(--dim);font-size:12px}
</style></head><body>
<header><h1>FF Agent &mdash; Team &amp; Player Intel</h1><div class="meta" id="meta">loading&hellip;</div></header>
<main id="main"><div class="spin">Loading&hellip;</div></main>
<nav>
<button id="nb-teams" class="on" onclick="go('teams')">Teams</button>
<button id="nb-players" onclick="go('players')">Players</button>
<button id="nb-flow" onclick="go('flow')">Flow</button>
<button id="nb-intel" onclick="go('intel')">Intel</button>
</nav>
<script>
const API='https://ekmuzafyqlbqttmfxsgw.supabase.co/functions/v1/ff-dashboard';
mermaid.initialize({startOnLoad:false,theme:'neutral',flowchart:{useMaxWidth:false}});
const MM='flowchart TB\n subgraph SRC["DATA SOURCES"]\n  S1["Sleeper API - rosters, depth, injuries (LIVE)"]\n  S2["Coach/Team Intel - 32 profiles + funnels (LOADED)"]\n  S3["Vegas lines - win totals, implied totals (partial)"]\n  S4["Schedule grid - byes, short weeks, SOS (pending)"]\n  S5["Measured data Wk4+ - PROE, pace, snap pct"]\n  S6["League platform - your roster, scoring, FAAB (pending: league ID)"]\n end\n subgraph DB["SUPABASE"]\n  D1[("ff_teams")]\n  D2[("ff_players")]\n  D3[("ff_sync_log")]\n  D4[("ff_league / ff_roster - next")]\n end\n S1 -->|"ff-sleeper-sync, auto 24h"| D2\n S2 --> D1\n S3 -.-> D1\n S4 -.-> D4\n S6 -.-> D4\n subgraph BRAIN["AGENT DECISION ENGINE (next build)"]\n  B1["Matchup scorer: player x DC funnel x venue x implied total"]\n  B2["Glass-box weights - editable multipliers"]\n  B3["Roster optimizer - start/sit + flex ranks"]\n  B4["Waiver scanner - snap spikes, injury openings, FAAB sizing"]\n  B5["Trade evaluator - tank-team sellers, deadline windows"]\n end\n D1 --> B1\n D2 --> B1\n B2 --> B1\n B1 --> B3\n D2 --> B4\n D1 --> B5\n S5 -.->|"supersedes priors Wk8"| B2\n subgraph WEEK["WEEKLY CADENCE"]\n  W1["TUE night - waivers run"]\n  W2["WED - waiver results + trade scan"]\n  W3["THU-SAT - injury monitoring"]\n  W4["SUN AM - inactives check, final lineup"]\n  W5["SUN-MON - late-swap watch"]\n end\n B4 --> W1\n B5 --> W2\n D2 --> W3\n B3 --> W4\n W3 --> W4\n W4 --> W5\n subgraph JASON["YOUR GATES (maestro mode)"]\n  J1{"Auto-execute: injury-driven swaps"}\n  J2{"Propose, you approve: trades, big FAAB, ranked drops"}\n  J3["Dashboard (this site)"]\n end\n W4 --> J1\n W1 --> J2\n W2 --> J2\n D1 --> J3\n D2 --> J3\n B1 -.->|"scores surface here next"| J3';
const $=s=>document.querySelector(s);const M=$('#main');
let TEAMS=[],view='teams';
const esc=s=>(s??'').toString().replace(/</g,'&lt;');
async function api(q){const r=await fetch(API+'?api='+q);return r.json()}
async function boot(){
  const p=new URLSearchParams(location.search);if(p.get('view'))view=p.get('view');
  try{
    const m=await api('meta');
    $('#meta').textContent=(m.playerCount||0)+' players \u00b7 '+(m.contractWatch||0)+' contract flags'+(m.last?' \u00b7 last sync '+m.last.slice(0,16).replace('T',' ')+'Z':'')+(m.syncTriggered?' \u00b7 refresh triggered':'');
    TEAMS=await api('teams');
  }catch(e){$('#meta').textContent='API unreachable \u2014 check Supabase functions';}
  go(view)}
function go(v){view=v;['teams','players','flow','intel'].forEach(x=>{const b=$('#nb-'+x);if(b)b.classList.toggle('on',x===v)});render()}
function render(){if(view==='teams')teams();else if(view==='players')players();else if(view==='flow')flow();else intel()}
async function flow(){
  M.innerHTML='<div class="legend"><span>\u2500\u2500 built &amp; running</span><span>\u254c\u254c pending</span></div><div id="flowwrap"><div class="spin">Rendering\u2026</div></div><div class="card" style="margin-top:10px"><h3>Reading the flow</h3><p class="kv">Sources feed Supabase; the decision engine (next build) crosses your players against opponent DC funnels, venue, and implied totals with editable glass-box weights; outputs run on the weekly cadence and hit your approval gates \u2014 auto for injury swaps, propose-and-approve for trades and big FAAB. Missing unlock: your league ID.</p></div>';
  try{const {svg}=await mermaid.render('ffflow',MM);$('#flowwrap').innerHTML=svg}catch(e){$('#flowwrap').innerHTML='<pre style="color:#333;font-size:11px;white-space:pre-wrap">'+esc(MM)+'</pre>'}
}
function tier(t){return t.vegas_win_total?'Vegas '+t.vegas_win_total:'Vegas: pending'}
function teams(){
  if(!TEAMS.length){M.innerHTML='<div class="spin">No team data \u2014 API unreachable.</div>';return}
  let h='';let lastDiv='';
  for(const t of TEAMS){const d=t.conference+' '+t.division;
    if(d!==lastDiv){h+='<div class="div-h">'+d+'</div>';lastDiv=d}
    h+='<div class="card" onclick="team(\''+t.abbr+'\')"><h3>'+esc(t.name)+'<span class="badge '+(t.variance_flag?'warn':'acc')+'">'+(t.variance_flag?'HIGH VARIANCE':tier(t))+'</span></h3>'+
    '<div class="kv">HC '+esc(t.hc)+' \u00b7 OC '+esc(t.oc)+' \u00b7 DC '+esc(t.dc)+'</div>'+
    '<div class="kv">Pace '+esc(t.pace)+' \u00b7 Pass '+esc(t.pass_lean)+' \u00b7 4th '+esc(t.fourth_down)+(t.sos_flag?' \u00b7 SOS: '+t.sos_flag:'')+'</div></div>'}
  M.innerHTML=h}
async function team(ab){
  const t=TEAMS.find(x=>x.abbr===ab);
  M.innerHTML='<button class="back" onclick="go(\'teams\')">\u2190 All teams</button><div class="card"><h3>'+esc(t.name)+'<span class="badge">'+tier(t)+'</span></h3>'+
  '<div class="kv">HC '+esc(t.hc)+' \u00b7 OC '+esc(t.oc)+' \u00b7 DC '+esc(t.dc)+'</div><div class="kv">Play-caller: '+esc(t.play_caller)+'</div>'+
  '<div class="kv">Pace '+esc(t.pace)+' \u00b7 Pass lean '+esc(t.pass_lean)+' \u00b7 4th-down '+esc(t.fourth_down)+'</div>'+
  sec('Identity',t.identity)+sec('OC profile',t.oc_profile)+sec('DC profile',t.dc_profile)+sec('Fantasy angle',t.fantasy_angle)+sec('Vs opponent types',t.vs_opponents)+
  '</div><div id="cwrap"></div><div class="card"><h3>Depth chart <span class="badge">live \u00b7 Sleeper</span></h3><div id="roster" class="spin">Loading\u2026</div></div>';
  api('contracts&team='+ab).then(cs=>{if(Array.isArray(cs)&&cs.length){let h='<div class="card"><h3>Contract watch <span class="badge warn">'+cs.length+' flag'+(cs.length>1?'s':'')+'</span></h3>';for(const c of cs){h+='<div class="sec"><b>'+esc(c.player)+' \u00b7 '+esc(c.position)+' \u00b7 Tier '+esc(c.signal_tier)+'</b><p>'+esc((c.status||'').replace(/_/g,' '))+' \u2014 '+esc(c.contract_context||'')+(c.incentive_status==='PARTIAL_PUBLIC'?' Incentives: '+esc(c.incentive_detail||''):'')+(c.tag_context?' '+esc(c.tag_context):'')+'</p></div>'}h+='<div class="kv" style="margin-top:8px">Guardrail: contract status never boosts projections \u2014 alerts only. UNKNOWN incentives \u2260 none.</div></div>';document.querySelector('#cwrap').innerHTML=h}});
  const ps=await api('players&team='+ab);
  if(!Array.isArray(ps)||!ps.length){$('#roster').innerHTML='<div class="kv">No players yet \u2014 sync may be running.</div>';return}
  const order=['QB','RB','WR','TE','K'];let h='';
  for(const pos of order){const g=ps.filter(p=>p.position===pos);if(!g.length)continue;
    h+='<table><tr><th>'+pos+'</th><th>Depth</th><th>Age</th><th>Exp</th><th>Status</th></tr>';
    for(const p of g)h+='<tr><td>'+esc(p.full_name)+'</td><td>'+(p.depth_chart_order??'\u2013')+'</td><td>'+(p.age??'\u2013')+'</td><td>'+(p.years_exp??'\u2013')+'</td><td>'+(p.injury_status?'<span class="inj">'+esc(p.injury_status)+'</span>':esc(p.status??''))+'</td></tr>';
    h+='</table>'}
  $('#roster').innerHTML=h}
function sec(k,v){return v?'<div class="sec"><b>'+k+'</b><p>'+esc(v)+'</p></div>':''}
async function players(){
  let topts='<option value="">All teams</option>';for(const t of TEAMS)topts+='<option>'+t.abbr+'</option>';
  M.innerHTML='<div class="row"><input id="pq" placeholder="Search name\u2026" oninput="pfilter()"><select id="pp" onchange="pfilter()"><option value="">All pos</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option></select></div>'+
  '<div class="row"><select id="pt" onchange="pfilter()">'+topts+'</select><select id="ps" onchange="pfilter()"><option value="">All status</option><option value="healthy">Healthy only</option><option value="flagged">Injury-flagged</option></select></div>'+
  '<div id="plist" class="spin">Loading\u2026</div>';
  window.PL=await api('players');pfilter()}
let PSORT={k:'search_rank',d:1};
function psort(k){if(PSORT.k===k)PSORT.d*=-1;else PSORT={k:k,d:1};pfilter()}
function pfilter(){
  const q=($('#pq')?.value||'').toLowerCase(),pos=$('#pp')?.value||'',tm=$('#pt')?.value||'',st=$('#ps')?.value||'';
  let rows=(window.PL||[]).filter(p=>(!q||p.full_name.toLowerCase().includes(q))&&(!pos||p.position===pos)&&(!tm||p.team===tm)&&(!st||(st==='healthy'?!p.injury_status:!!p.injury_status)));
  const k=PSORT.k,d=PSORT.d;
  rows.sort((a,b)=>{let x=a[k],y=b[k];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==='string')return d*x.localeCompare(y);return d*(x-y)});
  rows=rows.slice(0,200);
  if(!rows.length){$('#plist').innerHTML='<div class="kv">No players match these filters.</div>';return}
  const arw=key=>PSORT.k===key?(PSORT.d===1?' \u2191':' \u2193'):'';
  let h='<table><tr><th onclick="psort(\'search_rank\')">Rank'+arw('search_rank')+'</th><th onclick="psort(\'full_name\')">Player'+arw('full_name')+'</th><th onclick="psort(\'team\')">Team'+arw('team')+'</th><th onclick="psort(\'position\')">Pos'+arw('position')+'</th><th onclick="psort(\'depth_chart_order\')">Depth'+arw('depth_chart_order')+'</th><th>Status</th></tr>';
  for(const p of rows)h+='<tr onclick="team(\''+p.team+'\')"><td>'+(p.search_rank??'\u2013')+'</td><td>'+esc(p.full_name)+'</td><td>'+esc(p.team)+'</td><td>'+p.position+'</td><td>'+(p.depth_chart_order??'\u2013')+'</td><td>'+(p.injury_status?'<span class="inj">'+esc(p.injury_status)+'</span>':'')+'</td></tr>';
  $('#plist').innerHTML=h+'</table><div class="kv" style="margin-top:8px">'+rows.length+' shown \u00b7 tap headers to sort \u00b7 Rank = Sleeper search_rank (popularity proxy, not a projection) \u00b7 tap a row for team intel.</div>'}
function intel(){
  M.innerHTML=['<div class="card"><h3>Pipeline</h3><p class="kv">Sleeper players API \u2192 ff-sleeper-sync (Supabase edge fn) \u2192 ff_players \u2192 this site (GitHub Pages). Auto-resync when data &gt;24h old.</p></div>',
  '<div class="card"><h3>Verified 2026 signals</h3><p class="kv">BAL/LAR 11.5 league-high totals \u00b7 MIA/ARI 4.5 lowest \u00b7 Mahomes priced for early return \u00b7 Garrett traded to LAR \u00b7 Geno Smith to NYJ \u00b7 Wk1: NE-SEA SB rematch \u00b7 SOS: CHI/MIA/GB toughest, CLE/CIN/NO easiest</p></div>',
  '<div class="card"><h3>Ingest queue</h3><p class="kv">1. Full schedule + byes \u00b7 2. Remaining win totals \u00b7 3. Post-camp depth charts (CLE/NO/LV/IND QBs) \u00b7 4. 2026 OL/DL grades \u00b7 5. Referee crews (Wk1) \u00b7 6. Weekly PROE/pace (Wk4+, retires coach priors)</p></div>',
  '<div class="card"><h3>Contract layer</h3><p class="kv">17 active flags (as of 2026-08-09): Mayfield, Pickens (tag), Nacua &amp; Adams (LAR), Chase Brown, Kraft, LaPorta, Vea (TB DT dispute), Kyler Murray (MIN prove-it), Brissett (ARI incentives), more. Three-state incentive rule: KNOWN / PARTIAL_PUBLIC / UNKNOWN \u2014 UNKNOWN never means none. Resolved &amp; cleared: Olave, Taylor, Bijan, Gibbs (incentive-monitor kept), Flowers. Canonical doc: repo /layers/.</p></div>',
  '<div class="card"><h3>Provenance</h3><p class="kv">Coach/team intel: hand-verified July 2026. Tendencies are career-history priors, not measured 2026 data. Players: live Sleeper API, timestamped per row. No fabricated numbers \u2014 missing = pending, never backfilled.</p></div>'].join('')}
boot();
</script></body></html>
